<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Digital Assets</title>
		<!--
			Embedded-app setup: the Worker fills the meta tag below with the app's
			real client id on every HTML response (src/worker/index.ts), then App
			Bridge boots from the CDN. Polaris web components provide the admin
			look & feel (<s-page>, <s-button>, ...) with zero bundle weight.
		-->
		<meta name="shopify-api-key" content="%SHOPIFY_API_KEY%" />
		<script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
		<script src="https://cdn.shopify.com/shopifycloud/polaris.js"></script>
	</head>

	<body>
		<div id="root"></div>
		<script type="module" src="/src/client/main.tsx"></script>
	</body>
</html>
